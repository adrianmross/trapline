# devenv, agent-only: tell an agent about the repo's devenv when its session
# starts. Quiet unless the repo has a devenv.nix. Needs `trapline agent <name>`.

[[rule]]
id = "devenv-agent-session"
phase = "session_start"
when = { root_has = "devenv.nix", agent = true }
do = { hint = "this repo has a devenv.nix and its environment is loaded for the session: run tools directly. After switching worktrees or editing devenv.nix, use `devenv shell -- <cmd>`." }
