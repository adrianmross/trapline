# git: keep the root checkout on the default branch; make worktrees with wt.
# A root checkout off the default branch only warns, with firmer wording for
# agents. A raw `git worktree add` blocks agents. An agent is any caller with
# AGENT or CLAUDECODE set in its environment.

[[rule]]
id = "git-root-off-default"
tool = ["git"]
sub = ["commit", "push", "add", "merge", "rebase"]
phase = "pre"
when = { git = "root_off_default", agent = false }
do = { warn = "root checkout is on '{branch}', not '{default}'; feature work belongs in a wt worktree" }

[[rule]]
id = "git-root-off-default-agent"
tool = ["git"]
sub = ["commit", "push", "add", "merge", "rebase"]
phase = "pre"
when = { git = "root_off_default", agent = true }
do = { warn = "root checkout is on '{branch}', not '{default}'; do not edit or commit here. Use `wt switch --create <branch>`" }

[[rule]]
id = "git-worktree-add"
tool = ["git"]
args_start = ["worktree", "add"]
phase = "pre"
when = { agent = false }
do = { warn = "create worktrees with `wt switch --create <branch>`; it fires the post-switch hooks" }

[[rule]]
id = "git-worktree-add-agent"
tool = ["git"]
args_start = ["worktree", "add"]
phase = "pre"
when = { agent = true }
do = { warn = "create worktrees with `wt switch --create <branch>`; it fires the post-switch hooks", block = true }

[[rule]]
id = "git-session-root-off-default"
phase = "session_start"
when = { git = "root_off_default" }
do = { warn = "this is the ROOT checkout and it is on '{branch}', not '{default}'. Root checkouts stay on '{default}'; do feature work in a wt worktree (`wt switch --create <branch>`) and do not edit or commit here." }

# Sandbox: a repo's own checkout stays read-only. Its .git stays writable so a
# worktree can commit, except the checkout's own HEAD and index, so its branch
# cannot be switched either. A linked worktree stays writable even when it is
# nested inside that checkout. Used by `trapline sandbox`.
[[rule]]
id = "git-root-readonly"
phase = "sandbox"
when = { git = "in_repo" }
do = { deny_write = ["{main_root}"], allow_write = ["{main_root}/.git"], lock_write = ["{main_root}/.git/HEAD", "{main_root}/.git/index"] }

[[rule]]
id = "git-worktree-writable"
phase = "sandbox"
when = { git = "linked_worktree" }
do = { allow_write = ["{root}"] }
