# wt (worktrunk): point at state that makes its hooks or removals go wrong.

[[rule]]
id = "wt-switch-devenv-missing"
tool = ["wt"]
args_start = ["switch"]
phase = "pre"
when = { root_has = "devenv.nix", command_missing = "devenv" }
do = { warn = "devenv is not on PATH, so wt's post-switch warm-up will be skipped" }

[[rule]]
id = "wt-remove-agent"
tool = ["wt"]
args_start = ["remove"]
phase = "pre"
when = { agent = true }
do = { hint = "removing deletes the branch if merged; check unpushed and uncommitted work first (wt list)" }

# At session start, report what `wt step doctor` finds (stale entries, nested or
# stray worktrees, a root off its default branch...), one line per finding with
# its fix. Needs a wt with `step doctor --format=json`; silent with an older wt,
# no wt, no findings, or outside a repo.
[[rule]]
id = "wt-session-doctor"
phase = "session_start"
when = { git = "in_repo" }
do = { run = ["wt", "step", "doctor", "--format=json"], each = "wt step doctor: {kind}[ @ {path}][ ({branch})][: {detail}][; run {fix}]", timeout_ms = 5000 }
