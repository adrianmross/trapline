# devenv: no auto-activation on cd. Mark the prompt and point at `devenv shell`.
# Which tools to run inside it is yours to choose; see examples/config.toml.

[[rule]]
id = "devenv-prompt-on"
phase = "prompt"
when = { env_set = "DEVENV_ROOT" }
do = { set_env = { DEVENV_ON = "⬡ devenv" } }

[[rule]]
id = "devenv-prompt-off"
phase = "prompt"
when = { root_has = "devenv.nix", env_unset = "DEVENV_ROOT" }
do = { set_env = { DEVENV_OFF = "⬡ off" } }

[[rule]]
id = "devenv-notfound"
phase = "notfound"
when = { root_has = "devenv.nix", env_unset = "DEVENV_ROOT" }
do = { hint = "may live in this repo's devenv: run 'dev'" }
