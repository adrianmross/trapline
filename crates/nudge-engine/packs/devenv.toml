# devenv: no auto-activation on cd. Mark the prompt, point at `devenv shell`,
# and run selected tools inside it when you are in a devenv repo but not in it.

[[rule]]
id = "devenv-prompt-on"
phase = "prompt"
when = { env_set = "DEVENV_ROOT" }
do = { set_env = { DEVENV_ON = "⬡ devenv" } }

[[rule]]
id = "devenv-prompt-off"
phase = "prompt"
when = { root_has = "devenv.nix", env_unset = "DEVENV_ROOT" }
do = { set_env = { DEVENV_OFF = "⬡ off" } }

[[rule]]
id = "devenv-notfound"
phase = "notfound"
when = { root_has = "devenv.nix", env_unset = "DEVENV_ROOT" }
do = { hint = "may live in this repo's devenv: run 'dev'" }

[[rule]]
id = "devenv-launch"
tool = ["nvim"]
phase = "pre"
when = { root_has = "devenv.nix", env_unset = "DEVENV_ROOT" }
do = { wrap = ["devenv", "shell", "--no-tui", "--"] }
