name: Release
on:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 scripts/test-guidance-install.py
      - run: python3 scripts/test-release-install.py
      - run: cargo test --workspace --locked --target "${{ matrix.target }}"
      - run: cargo build --release --workspace --locked --target "${{ matrix.target }}"
      - env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package-release.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"} --binary-dir "target/${{ matrix.target }}/release"
      - name: Verify installed native archive
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          tar xzf dist/trapline-*.tar.gz -C "$fixture"
          python3 "$fixture"/trapline-*/scripts/install-release.py --home "$fixture/home"
          "$fixture/home/.local/bin/trapline" --version
          "$fixture/home/.local/bin/nudge" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: dist/trapline-*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
