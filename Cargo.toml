[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adrianmross/trapline"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
shlex = "1"
clap = { version = "4", features = ["derive"] }
trapline-core = { path = "crates/trapline-core" }
nudge-engine = { path = "crates/nudge-engine" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
